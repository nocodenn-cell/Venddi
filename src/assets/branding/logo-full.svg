<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Símbolo: V estilizada com movimento -->
  <g id="logo-symbol">
    <!-- Fundo circular -->
    <circle cx="30" cy="30" r="28" fill="#0EA572"/>
    
    <!-- V estilizada -->
    <path d="M 18 20 L 30 42 L 42 20" 
          stroke="white" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Linha de movimento/check -->
    <path d="M 24 32 L 28 36 L 36 26" 
          stroke="white" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"
          opacity="0.9"/>
  </g>
  
  <!-- Texto "Venddi" -->
  <text x="70" y="40" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="32" 
        font-weight="700" 
        fill="#1F2937"
        letter-spacing="-0.5">
    Venddi
  </text>
</svg>
